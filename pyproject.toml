[project]
name = "iceberg-doctor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.3.0",
    "pyiceberg[pyarrow,sql-sqlite]>=0.12.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
iceberg-doctor = "iceberg_doctor.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
